services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/please-change-me
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p please-change-me 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env            # provider keys (ANTHROPIC_API_KEY / OPENAI_API_KEY) and model overrides
    environment:
      BRAIN_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: please-change-me
      LLM_BACKEND: ${LLM_BACKEND:-litellm}
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
